name: Test and package desktop clients
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-amd64
          - os: windows-latest
            target: windows-amd64
          - os: ubuntu-22.04
            target: linux-amd64
          - os: ubuntu-22.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Configure Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - name: Test API and settings
        shell: bash
        run: go test -race ./internal/redmine ./internal/settings
      - name: Test interface with software renderer
        shell: bash
        run: go test -tags ci ./internal/ui
      - name: Build and package
        shell: bash
        run: ./packaging/package.sh
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          Compress-Archive -Path dist/redmineapp.exe,LICENSE,NOTICE,THIRD_PARTY_NOTICES.txt -DestinationPath dist/redmineapp-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: redmineapp-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.tar.gz
            dist/*setup.exe
          if-no-files-found: error
